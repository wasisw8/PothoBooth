<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none">
  <!-- Rainbow Border -->
  <rect x="5" y="5" width="630" height="470" rx="20" stroke="url(#rainbow)" stroke-width="10" fill="none"/>
  <defs>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="16%" stop-color="#FF8800"/>
      <stop offset="33%" stop-color="#FFFF00"/>
      <stop offset="50%" stop-color="#00CC00"/>
      <stop offset="66%" stop-color="#0088FF"/>
      <stop offset="83%" stop-color="#4400FF"/>
      <stop offset="100%" stop-color="#8800FF"/>
    </linearGradient>
  </defs>
  <!-- Corner stars -->
  <text x="30" y="40" font-size="24">⭐</text>
  <text x="590" y="40" font-size="24">🌟</text>
  <text x="30" y="470" font-size="24">🌟</text>
  <text x="590" y="470" font-size="24">⭐</text>
  <!-- Rainbow emoji -->
  <text x="320" y="30" text-anchor="middle" font-size="24">🌈</text>
</svg>
